<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102747"/>
      <stop offset="100%" stop-color="#1769aa"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background with squircle safe padding for Android icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Badge / Wheel -->
  <circle cx="256" cy="230" r="160" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="12"/>
  <circle cx="256" cy="230" r="140" fill="rgba(255,255,255,0.06)"/>

  <!-- Bus Graphic -->
  <g transform="translate(136, 120)">
    <!-- Bus Roof & Body -->
    <rect x="15" y="20" width="210" height="150" rx="28" fill="#ffffff" />
    <!-- Front Windshield -->
    <rect x="30" y="38" width="180" height="52" rx="12" fill="#102747" />
    <path d="M120 38 L120 90" stroke="#ffffff" stroke-width="3"/>
    <!-- Headlights -->
    <circle cx="48" cy="120" r="14" fill="url(#goldGrad)" />
    <circle cx="192" cy="120" r="14" fill="url(#goldGrad)" />
    <!-- Bus Grille -->
    <rect x="80" y="112" width="80" height="20" rx="4" fill="#cbd5e1" />
    <line x1="90" y1="122" x2="150" y2="122" stroke="#64748b" stroke-width="2"/>
    <line x1="90" y1="117" x2="150" y2="117" stroke="#64748b" stroke-width="2"/>
    <line x1="90" y1="127" x2="150" y2="127" stroke="#64748b" stroke-width="2"/>
    <!-- Bumper -->
    <rect x="25" y="146" width="190" height="18" rx="8" fill="#1e293b" />
    <!-- Tires -->
    <rect x="25" y="166" width="36" height="22" rx="6" fill="#0f172a" />
    <rect x="179" y="166" width="36" height="22" rx="6" fill="#0f172a" />
    <!-- KM Gauge Icon in center -->
    <circle cx="120" cy="64" r="14" fill="#1769aa"/>
    <path d="M120 64 L126 58" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Text GSRTC KM -->
  <text x="256" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">GSRTC</text>
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="4">PROPAR KM</text>
  <text x="256" y="452" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#93c5fd" text-anchor="middle">OFFLINE &amp; AI STUDIO</text>
</svg>
